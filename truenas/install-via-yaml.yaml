# KTN Enclosure Manager — paste-into-TrueNAS install
#
# TrueNAS SCALE → Apps → Discover Apps → ⋮ → Install via YAML
# Paste this whole file, edit the ### EDIT ### lines, and install.
#
# Nothing is installed on the host and no TrueNAS configuration is changed.
# The container runs under the default AppArmor profile with all capabilities
# dropped except the two needed to drop privileges. It is not privileged and
# needs no /sys mount.
#
# Full explanation: https://github.com/MechanicalCoderX/ktn-enclosure-manager/blob/main/SECURITY.md

# Gives the app a clickable "Web UI" button on its card in the TrueNAS Apps
# list. TrueNAS reads this top-level key back out of the rendered compose
# config, so it works for a custom app even though custom apps get no portal
# by default. Change the port here too if you changed it above.
x-portals:
  - name: Web UI
    scheme: http
    # Leave this as 0.0.0.0 - it is not a placeholder and needs no editing.
    #
    # The stored URL really is http://0.0.0.0:8420/, and the API returns it
    # that way, but the WebUI rewrites the host when you click the button:
    # openPortalLink() replaces a 0.0.0.0 hostname with window.location
    # .hostname (bracketing it if it is IPv6). So the button follows whatever
    # address you browsed to - LAN IP, hostname, VPN address - which a
    # hardcoded value cannot do.
    host: 0.0.0.0
    port: 8420
    path: /

# Shown on the app's page in the TrueNAS Apps UI, the same way catalog apps
# present their notes. Read back out of the rendered compose config.
x-notes: |
  # KTN Enclosure Manager

  ## First run

  There is **no account and no default password**. Open the Web UI and create
  the administrator immediately.

  ## What this app can touch

  - Reads the Linux enclosure sysfs tree and the TrueNAS API.
  - Runs read-only `sg_ses` telemetry pages.
  - The only write it can perform is a drive bay's **IDENT LED**.

  It is not privileged, mounts no host path other than its own data directory,
  keeps Docker's default AppArmor profile, and drops every capability except
  the two used to drop the web process to uid 1000.

  ## Requirements

  The data storage must be writable by uid 1000. If you chose a Host Path:

      chown -R 1000:1000 <path>

  The app refuses to start otherwise, because accounts and the audit log
  would not persist.

services:
  ktn-enclosure-manager:
    image: ghcr.io/mechanicalcoderx/ktn-enclosure-manager:1.2.9
    container_name: ktn-enclosure-manager
    restart: unless-stopped

    ports:
      # Change 8420 if it clashes with another app.
      - "8420:8420"

    volumes:
      # ### EDIT ### a dataset for accounts, session key, IDENT timers, audit log.
      # Create it first, then:  chown -R 1000:1000 /mnt/<pool>/apps/ktn-enclosure-manager
      # The app refuses to start if this is not writable by uid 1000.
      - /mnt/YOURPOOL/apps/ktn-enclosure-manager:/data

    devices:
      # ### EDIT ### your SES device.  Find it with:  lsscsi -g | grep enclosu
      #
      # This is the only hardware access the app needs. ':rw' is required even
      # though nothing on your disks is written: sg_ses submits SCSI commands
      # through the SG_IO ioctl, which the device cgroup counts as a write.
      # It addresses the enclosure processor, not disk data.
      - "/dev/sg16:/dev/sg16:rw"

    cap_drop:
      - ALL
    cap_add:
      # Only to drop the web process from root to uid 1000 at startup.
      - SETUID
      - SETGID

    security_opt:
      - no-new-privileges:true
      # The default AppArmor profile stays in place. Earlier versions of this
      # app needed apparmor=unconfined to write the LED through sysfs; it now
      # uses a SCSI command instead, which that profile permits.

    tmpfs:
      # setgid so the helper's socket inherits gid 1000; avoids needing CAP_CHOWN.
      - /run/ktn:mode=2770,uid=0,gid=1000

    environment:
      KTN_DATA_DIR: /data
      KTN_PORT: "8420"
      KTN_IDENT_HELPER_SOCKET: /run/ktn/ident.sock
      KTN_IDENT_METHOD: "auto"

      # ### EDIT ### TrueNAS API, for pool / vdev / ZFS error / SMART data.
      # Credentials → API Keys → Add. Leave the URL empty to run without it;
      # the drive map, chassis telemetry and Identify all still work.
      KTN_TRUENAS_URL: "https://YOUR-TRUENAS-ADDRESS"
      KTN_TRUENAS_API_KEY: ""
      # Set false only for a self-signed certificate you cannot replace.
      KTN_TRUENAS_VERIFY_TLS: "true"

      # Optional: restrict management to one enclosure.
      # Find yours with:  cat /sys/class/enclosure/*/id
      KTN_ENCLOSURE_ALLOWLIST: ""

      # Optional: get told when a bay degrades. An ntfy topic URL, or any
      # endpoint accepting a POST. Empty disables alerting.
      KTN_ALERT_WEBHOOK_URL: ""
      KTN_ALERT_STYLE: "ntfy"

      KTN_POLL_SLOTS_SECONDS: "5"
      KTN_POLL_TRUENAS_SECONDS: "20"
      KTN_POLL_SES_SECONDS: "30"
      KTN_POLL_SMART_SECONDS: "120"
