enclosure:
  # CI has no SAS shelf, so this points at a node that exists in the runner.
  # The app discovers the real enclosure itself and degrades cleanly without
  # one, so rendering and startup are still exercised.
  sg_device: /dev/null
  allowlist: ""

access:
  auth_required: true
  allow_anonymous_ident: false

truenas:
  url: ""
  api_key: ""
  verify_tls: true

network:
  web_port:
    bind_mode: published
    port_number: 30420
    host_ips: []

ix_volumes:
  data: /opt/tests/mnt/data

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true

resources:
  limits:
    cpus: 2
    memory: 512
