name: Verify

# The verification gate, defined once and called by two workflows:
#
#   ci.yml            on every push and pull request
#   publish-image.yml before it pushes anything to the registry
#
# It lives in its own reusable workflow rather than being duplicated so the
# two cannot drift apart. Drift is not hypothetical here: "Publish image" and
# CI built the same Dockerfile independently, and on v1.3.3 the CI build failed
# on a TypeScript error while publish succeeded and shipped an image - its
# frontend came from a cached layer, so `npm run build` never re-ran. The
# release was fine by luck; a cache miss would have published a broken one.
#
# Actions are pinned by commit SHA for the same reason the Dockerfile pins its
# base images by digest: a moving tag can be repointed upstream. The trailing
# comment records the release each SHA was taken from; the github-actions
# Dependabot entry bumps SHA and comment together.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      # Must track the runtime base image in the Dockerfile. Testing on a
      # different interpreter than the one shipped means the suite can pass
      # while the released image fails on a version-specific change.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e 'backend[dev]'

      - name: Lint
        run: ruff check backend helper tests

      - name: Tests
        # The suite runs entirely against captured fixtures; no hardware and no
        # TrueNAS instance is required.
        run: PYTHONPATH=backend pytest tests/ -q

      - name: Audit dependencies
        # --skip-editable: the project itself is installed editable for tests
        # and is not on PyPI. --strict is deliberately NOT used: it promotes any
        # skipped distribution to a hard error, which would fail on our own
        # package forever. pip-audit still exits non-zero when it finds an
        # actual vulnerability, which is the behaviour we want.
        run: |
          pip install pip-audit
          pip-audit --desc --skip-editable

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Must track the frontend builder image in the Dockerfile. Building on a
      # different Node - and therefore a different npm - resolves a different
      # dependency tree, which is how a TypeScript error once passed here and
      # failed the image build on the same commit.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      - name: Audit dependencies
        # Production dependencies only: a dev-only advisory in the build chain
        # is not shipped to anyone and should not block a release.
        run: npm audit --omit=dev --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend
        run: |
          python -m venv .venv
          .venv/bin/pip install -e 'backend[dev]'

      - name: Install frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium

      - name: E2E
        working-directory: frontend
        run: npx playwright test

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # Both architectures that publish-image.yml pushes, built and scanned here.
  # Before this was a matrix the gate built amd64 only, while publish built
  # linux/amd64,linux/arm64 - the arm64 layers were born after the gate and
  # reached the registry with no Trivy scan ever run on them. Trivy inspects
  # layer contents without executing anything, so scanning the emulated arm64
  # image is exact; actually RUNNING the suite per-arch is a different (and
  # unpaid-for) job - tests and E2E stay amd64-only above.
  image:
    name: image builds (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `arch` exists because `platform` contains a slash, which is unsafe
        # in a gha cache scope name.
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # QEMU user-mode emulation: the Dockerfile's RUN steps execute arm64
      # binaries (pip, apt) during the foreign-arch build. Native amd64 does
      # not need it, so the step is skipped there to keep that leg identical
      # to what it was before the matrix existed.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: matrix.arch != 'amd64'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          # `load` works for a single foreign platform: the daemon stores the
          # image without running it, which is all Trivy needs.
          load: true
          tags: ktn-enclosure-manager:ci
          # Per-arch scopes: with a shared scope the two legs race each other's
          # cache export, and publish-image.yml could not tell which arch it
          # was reusing. It reads both scopes, so on a cache hit the layers it
          # pushes are the exact layers scanned below.
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}

          # The runtime stage is rebuilt every run. Its inputs never change -
          # same base digest, same RUN string - so buildx reuses that layer
          # indefinitely and the `apt-get -y upgrade` inside it stays frozen at
          # whatever Debian shipped the day the layer was first built. The
          # upgrade line exists precisely to pick up security point-releases
          # between base-image rebuilds; the cache silently cancels it, and the
          # scan below then passes or fails on packages nobody is still shipping.
          #
          # Measured on 2026-09-22, same commit, one variable: a cached build
          # held gzip 1.13-1, libpcre2-8-0 10.46-1~deb13u1, libsqlite3-0
          # 3.46.1-7+deb13u1 and perl-base 5.40.1-6 and failed with 13 findings
          # (perl-base CVE-2026-13221 is CRITICAL); a --no-cache build of that
          # identical commit produced the +deb13u1/u2 security versions and
          # scanned clean. So the 13 findings were the cache, not the base
          # image. Bumping the pinned digest only appears to fix it, because a
          # new digest busts the cache - the findings return once that layer
          # goes stale in turn.
          #
          # This is the v1.3.3 failure in a different stage: a cached layer
          # meant a gate never ran on what actually shipped.
          #
          # Only `runtime` is uncached. The frontend stage is keyed on
          # package-lock.json and the sources it copies, so it invalidates
          # correctly on its own and `npm ci` stays cached. publish-image.yml
          # deliberately does NOT set this: it has to push the exact layers
          # scanned here, and a fresh apt run there could resolve a different
          # package set minutes later.
          no-cache-filters: runtime

      - name: Scan image for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ktn-enclosure-manager:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
