name: Verify

# The verification gate, defined once and called by two workflows:
#
#   ci.yml            on every push and pull request
#   publish-image.yml before it pushes anything to the registry
#
# It lives in its own reusable workflow rather than being duplicated so the
# two cannot drift apart. Drift is not hypothetical here: "Publish image" and
# CI built the same Dockerfile independently, and on v1.3.3 the CI build failed
# on a TypeScript error while publish succeeded and shipped an image - its
# frontend came from a cached layer, so `npm run build` never re-ran. The
# release was fine by luck; a cache miss would have published a broken one.
#
# Actions are pinned by commit SHA for the same reason the Dockerfile pins its
# base images by digest: a moving tag can be repointed upstream. The trailing
# comment records the release each SHA was taken from; the github-actions
# Dependabot entry bumps SHA and comment together.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      # Must track the runtime base image in the Dockerfile. Testing on a
      # different interpreter than the one shipped means the suite can pass
      # while the released image fails on a version-specific change.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e 'backend[dev]'

      - name: Lint
        run: ruff check backend helper tests

      - name: Tests
        # The suite runs entirely against captured fixtures; no hardware and no
        # TrueNAS instance is required.
        run: PYTHONPATH=backend pytest tests/ -q

      - name: Audit dependencies
        # --skip-editable: the project itself is installed editable for tests
        # and is not on PyPI. --strict is deliberately NOT used: it promotes any
        # skipped distribution to a hard error, which would fail on our own
        # package forever. pip-audit still exits non-zero when it finds an
        # actual vulnerability, which is the behaviour we want.
        run: |
          pip install pip-audit
          pip-audit --desc --skip-editable

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Must track the frontend builder image in the Dockerfile. Building on a
      # different Node - and therefore a different npm - resolves a different
      # dependency tree, which is how a TypeScript error once passed here and
      # failed the image build on the same commit.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      - name: Audit dependencies
        # Production dependencies only: a dev-only advisory in the build chain
        # is not shipped to anyone and should not block a release.
        run: npm audit --omit=dev --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend
        run: |
          python -m venv .venv
          .venv/bin/pip install -e 'backend[dev]'

      - name: Install frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium

      - name: E2E
        working-directory: frontend
        run: npx playwright test

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # Both architectures that publish-image.yml pushes, built and scanned here.
  # Before this was a matrix the gate built amd64 only, while publish built
  # linux/amd64,linux/arm64 - the arm64 layers were born after the gate and
  # reached the registry with no Trivy scan ever run on them. Trivy inspects
  # layer contents without executing anything, so scanning the emulated arm64
  # image is exact; actually RUNNING the suite per-arch is a different (and
  # unpaid-for) job - tests and E2E stay amd64-only above.
  image:
    name: image builds (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `arch` exists because `platform` contains a slash, which is unsafe
        # in a gha cache scope name.
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # QEMU user-mode emulation: the Dockerfile's RUN steps execute arm64
      # binaries (pip, apt) during the foreign-arch build. Native amd64 does
      # not need it, so the step is skipped there to keep that leg identical
      # to what it was before the matrix existed.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: matrix.arch != 'amd64'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          # `load` works for a single foreign platform: the daemon stores the
          # image without running it, which is all Trivy needs.
          load: true
          tags: ktn-enclosure-manager:ci
          # Per-arch scopes: with a shared scope the two legs race each other's
          # cache export, and publish-image.yml could not tell which arch it
          # was reusing. It reads both scopes, so on a cache hit the layers it
          # pushes are the exact layers scanned below.
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}

          # The runtime stage is rebuilt every run. Its inputs never change -
          # same base digest, same RUN string - so buildx reuses that layer
          # indefinitely and the `apt-get -y upgrade` inside it stays frozen at
          # whatever Debian shipped the day the layer was first built. The
          # upgrade line exists precisely to pick up security point-releases
          # between base-image rebuilds; the cache silently cancels it, and the
          # scan below then passes or fails on packages nobody is still shipping.
          #
          # Measured on 2026-09-22, same commit, one variable: a cached build
          # held gzip 1.13-1, libpcre2-8-0 10.46-1~deb13u1, libsqlite3-0
          # 3.46.1-7+deb13u1 and perl-base 5.40.1-6 and failed with 13 findings
          # (perl-base CVE-2026-13221 is CRITICAL); a --no-cache build of that
          # identical commit produced the +deb13u1/u2 security versions and
          # scanned clean. So the 13 findings were the cache, not the base
          # image. Bumping the pinned digest only appears to fix it, because a
          # new digest busts the cache - the findings return once that layer
          # goes stale in turn.
          #
          # This is the v1.3.3 failure in a different stage: a cached layer
          # meant a gate never ran on what actually shipped.
          #
          # Only `runtime` is uncached. The frontend stage is keyed on
          # package-lock.json and the sources it copies, so it invalidates
          # correctly on its own and `npm ci` stays cached. publish-image.yml
          # deliberately does NOT set this: it has to push the exact layers
          # scanned here, and a fresh apt run there could resolve a different
          # package set minutes later.
          no-cache-filters: runtime

      - name: Scan image for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ktn-enclosure-manager:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  # The only container-level test. Everything above checks the Python and
  # shell pieces of opt-in TLS on their own; this runs the built image the way
  # TrueNAS does - root entrypoint holding only SETUID/SETGID, a root:root
  # 0400 key bound read-only with the long (--mount) syntax, the /run/ktn
  # tmpfs, unless-stopped - which is the one place the root-to-uid-1000 key
  # copy, the HEALTHCHECK script and the renew-and-restart path are exercised
  # together. Certificates are throwaway, generated here, never printed.
  tls-smoke:
    name: TLS container smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: ktn-enclosure-manager:smoke
          # Reads the amd64 image job's cache and writes none: this job only
          # needs a runnable image, and must not race that job's cache scope.
          cache-from: type=gha,scope=image-amd64

      - name: Prepare certificates and data directories
        run: |
          set -euo pipefail
          mkdir -p smoke/gen smoke/tls smoke/data-tls smoke/data-bad smoke/data-plain
          gen() {
            openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes \
              -keyout "smoke/gen/$1.key" -out "smoke/gen/$1.crt" -days 30 \
              -subj "/CN=ktn-smoke.test" -addext "subjectAltName=DNS:ktn-smoke.test" 2>/dev/null
          }
          gen first; gen second; gen other
          # TrueNAS's modes: the chain world-readable, the key root:root 0400.
          sudo install -o root -g root -m 0644 smoke/gen/first.crt smoke/tls/fullchain.pem
          sudo install -o root -g root -m 0400 smoke/gen/first.key smoke/tls/privkey.pem
          sudo install -o root -g root -m 0400 smoke/gen/other.key smoke/tls/otherkey.pem
          sudo chown 1000:1000 smoke/data-tls smoke/data-bad smoke/data-plain

      - name: TLS container starts healthy and serves only HTTPS
        run: |
          source .github/tls-smoke-lib.sh
          docker run -d --name ktn-tls --restart unless-stopped "${HARDENING[@]}" \
            --mount "type=bind,src=$PWD/smoke/tls/fullchain.pem,dst=/tls/fullchain.pem,readonly" \
            --mount "type=bind,src=$PWD/smoke/tls/privkey.pem,dst=/tls/privkey.pem,readonly" \
            -v "$PWD/smoke/data-tls:/data" -p 127.0.0.1:18443:8420 \
            -e KTN_TLS_ENABLED=true \
            -e KTN_TLS_CERTFILE=/tls/fullchain.pem -e KTN_TLS_KEYFILE=/tls/privkey.pem \
            -e KTN_TLS_RELOAD_CHECK_SECONDS=60 -e KTN_TLS_RELOAD_SETTLE_SECONDS=5 \
            "$IMAGE"
          wait_healthy ktn-tls

          code=$("${HTTPS[@]}" -o /dev/null -w '%{http_code}' https://ktn-smoke.test:18443/healthz)
          [ "$code" = 200 ] || fail "https /healthz returned $code"
          "${HTTPS[@]}" https://ktn-smoke.test:18443/healthz | grep -q '"tls":{"enabled":true' \
            || fail "/healthz has no tls block"
          if curl -sS --max-time 10 -o /dev/null http://127.0.0.1:18443/healthz; then
            fail "plain http answered on the TLS port"
          fi

          body='{"username":"admin","password":"smoke-test-password"}'
          "${HTTPS[@]}" -o /dev/null -H 'X-KTN-Request: 1' -H 'Content-Type: application/json' \
            -d "$body" https://ktn-smoke.test:18443/api/auth/bootstrap
          "${HTTPS[@]}" -o /dev/null -D smoke/login.headers -H 'X-KTN-Request: 1' \
            -H 'Content-Type: application/json' -d "$body" https://ktn-smoke.test:18443/api/auth/login
          grep -i '^set-cookie: ktn_session=' smoke/login.headers | grep -qi '; *secure' \
            || fail "session cookie is not Secure over https"

      - name: The key stays root-only; the served copy is uid 1000, 0600, on tmpfs
        run: |
          source .github/tls-smoke-lib.sh
          if docker exec -u 1000 ktn-tls test -r /tls/privkey.pem; then
            fail "uid 1000 can read the mounted key"
          fi
          # Control: the same uid reads the world-readable chain beside it.
          docker exec -u 1000 ktn-tls test -r /tls/fullchain.pem
          # As uid 1000: /run/ktn/tls is 0700 and container root has no
          # CAP_DAC_READ_SEARCH to look inside it. Metadata only.
          [ "$(docker exec -u 1000 ktn-tls stat -f -c %T /run/ktn/tls)" = tmpfs ] \
            || fail "/run/ktn/tls is not on tmpfs"
          meta=$(docker exec -u 1000 ktn-tls stat -c '%u:%g %a' /run/ktn/tls/key.pem)
          [ "$meta" = "1000:1000 600" ] || fail "served key copy is $meta"

      - name: An in-place renewal restarts the container onto the new certificate
        run: |
          source .github/tls-smoke-lib.sh
          [ "$(docker inspect -f '{{.RestartCount}}' ktn-tls)" = 0 ] || fail "restarted early"
          inode=$(stat -c %i smoke/tls/fullchain.pem)
          # As TrueNAS writes them: truncate and rewrite the same inode, cert first.
          sudo sh -c 'cat smoke/gen/second.crt > smoke/tls/fullchain.pem'
          sudo sh -c 'cat smoke/gen/second.key > smoke/tls/privkey.pem'
          [ "$(stat -c %i smoke/tls/fullchain.pem)" = "$inode" ] || fail "rewrite changed the inode"

          # Check interval 60 s + settle 5 s + restart, with margin.
          for _ in $(seq 1 120); do
            [ "$(docker inspect -f '{{.RestartCount}}' ktn-tls)" = 1 ] && break
            sleep 1
          done
          [ "$(docker inspect -f '{{.RestartCount}}' ktn-tls)" = 1 ] || fail "no restart after renewal"
          wait_healthy ktn-tls
          docker logs ktn-tls 2>&1 | grep -q 'renewed TLS certificate detected' \
            || fail "the watcher did not log the renewal"

          expected=$(fingerprint < smoke/gen/second.crt)
          served=$(openssl s_client -connect 127.0.0.1:18443 -servername ktn-smoke.test \
                     </dev/null 2>/dev/null | fingerprint)
          [ "$served" = "$expected" ] || fail "served $served, expected $expected"

      - name: A mismatched key refuses to start, with no plain-http fallback
        run: |
          source .github/tls-smoke-lib.sh
          docker run -d --name ktn-bad --restart no "${HARDENING[@]}" \
            --mount "type=bind,src=$PWD/smoke/tls/fullchain.pem,dst=/tls/fullchain.pem,readonly" \
            --mount "type=bind,src=$PWD/smoke/tls/otherkey.pem,dst=/tls/privkey.pem,readonly" \
            -v "$PWD/smoke/data-bad:/data" -p 127.0.0.1:18444:8420 \
            -e KTN_TLS_ENABLED=true \
            -e KTN_TLS_CERTFILE=/tls/fullchain.pem -e KTN_TLS_KEYFILE=/tls/privkey.pem \
            "$IMAGE"
          for _ in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Status}}' ktn-bad)" = exited ] && break
            sleep 1
          done
          [ "$(docker inspect -f '{{.State.Status}}' ktn-bad)" = exited ] || fail "still running"
          [ "$(docker inspect -f '{{.State.ExitCode}}' ktn-bad)" != 0 ] || fail "exit code 0"
          docker logs ktn-bad 2>&1 | grep -q 'ERROR: TLS' || fail "no TLS error logged"
          if docker logs ktn-bad 2>&1 | grep -q -- '-----BEGIN'; then fail "PEM text in logs"; fi
          if curl -sS --max-time 5 -o /dev/null http://127.0.0.1:18444/healthz; then
            fail "plain http answered"
          fi
          if curl -sSk --max-time 5 -o /dev/null https://127.0.0.1:18444/healthz; then
            fail "https answered"
          fi

      - name: Back-compat control - TLS unset is plain HTTP, healthy
        run: |
          source .github/tls-smoke-lib.sh
          docker run -d --name ktn-plain --restart unless-stopped "${HARDENING[@]}" \
            -v "$PWD/smoke/data-plain:/data" -p 127.0.0.1:18420:8420 "$IMAGE"
          wait_healthy ktn-plain
          code=$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' http://127.0.0.1:18420/healthz)
          [ "$code" = 200 ] || fail "plain /healthz returned $code"
          if curl -sS --max-time 10 http://127.0.0.1:18420/healthz | grep -q '"tls"'; then
            fail "a plain install reports a tls block"
          fi

      - name: Container logs
        if: always()
        run: |
          for name in ktn-tls ktn-bad ktn-plain; do
            echo "::group::$name"
            docker logs "$name" 2>&1 || true
            echo "::endgroup::"
          done
