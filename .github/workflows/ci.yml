name: CI

# A thin caller. The checks themselves live in verify.yml so that
# publish-image.yml can run exactly the same ones before it pushes an image,
# rather than the two keeping their own copies and drifting.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
