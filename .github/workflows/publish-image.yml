name: Publish image

# Publishes to GitHub Container Registry so TrueNAS users can install without
# building anything. Free for public repositories.
#
#   ghcr.io/<owner>/ktn-enclosure-manager:1.0.0
#   ghcr.io/<owner>/ktn-enclosure-manager:latest
#
# After the first successful run, make the package public once:
#   GitHub -> your profile -> Packages -> ktn-enclosure-manager
#   -> Package settings -> Change visibility -> Public
# Otherwise `docker pull` will ask TrueNAS users for credentials.

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ktn-enclosure-manager

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # linux/arm64 is included because TrueNAS SCALE runs on arm64 in some
          # deployments; the image is pure Python plus sg3-utils, so it is
          # portable. Drop arm64 if build time becomes a problem.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
