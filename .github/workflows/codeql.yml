name: CodeQL

# Static analysis for the class of bug this project actually shipped: v1.1.1
# fixed an unauthenticated path traversal that looked like
# `FRONTEND_DIR / user_input` -> FileResponse. CodeQL flags exactly that shape,
# and it survived a full test suite, ruff and mypy without complaint.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so newly-published query packs get applied to unchanged code.
    - cron: "27 4 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      # SHA-pinned like every other action in this repo's workflows (rationale
      # in verify.yml's header); Dependabot bumps SHA and version comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: "/language:${{ matrix.language }}"
