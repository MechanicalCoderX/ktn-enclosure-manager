version: 2
updates:
  # backend/requirements.txt is the image's hash-pinned lock, compiled by
  # `uv pip compile --universal --python-version 3.15 --generate-hashes` from
  # requirements.in (CONTRIBUTING.md, "Dependency lock"). This is the uv
  # ecosystem, not pip, on purpose: uv reads --python-version, --universal and
  # --generate-hashes back from the lock header and recompiles with them. The
  # pip ecosystem re-runs pip-compile with no --universal, so its lock would be
  # resolved for one platform only.
  #
  # uv chooses the target version of each direct dependency (the ones declared
  # in pyproject.toml), security updates included, under the lowest Python that
  # requires-python allows. That floor is ">=3.15", the image's Python, so
  # every release the image can run is proposed;
  # tests/test_version_consistency.py fails if the image moves without it.
  # uv's support for `uv pip compile` files is in dependabot-core's code and
  # specs, not its docs.
  - package-ecosystem: uv
    directory: /backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      # vite and its plugin declare a peer relationship, so a lone bump of
      # either produces an uninstallable tree. Same for the react/react-dom and
      # type packages.
      build-toolchain:
        patterns: ["vite", "@vitejs/*", "typescript"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      everything-else:
        patterns: ["*"]
        exclude-patterns: ["vite", "@vitejs/*", "typescript", "react", "react-dom", "@types/react*"]
        update-types: [minor, patch]

  # Keeps the digest-pinned base images current. Pinning without this trades a
  # supply-chain risk for a staleness one. It reads FROM lines only, so the
  # Dockerfile's `# syntax=` frontend pin is mirrored in a never-built
  # `syntax-pin` stage that this entry bumps (see the Dockerfile's comment).
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]
