version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      # vite and its plugin declare a peer relationship, so a lone bump of
      # either produces an uninstallable tree. Same for the react/react-dom and
      # type packages.
      build-toolchain:
        patterns: ["vite", "@vitejs/*", "typescript"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      everything-else:
        patterns: ["*"]
        exclude-patterns: ["vite", "@vitejs/*", "typescript", "react", "react-dom", "@types/react*"]
        update-types: [minor, patch]

  # Keeps the digest-pinned base images current. Pinning without this trades a
  # supply-chain risk for a staleness one.
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]
