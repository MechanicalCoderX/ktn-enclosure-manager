version: 2
updates:
  # backend/requirements.txt is the image's hash-pinned lock, compiled by
  # `uv pip compile --universal --python-version 3.15 --generate-hashes` from
  # requirements.in (CONTRIBUTING.md, "Dependency lock"). This is the uv
  # ecosystem, not pip, on purpose: uv reads --python-version, --universal and
  # --generate-hashes back from the lock header and recompiles with them. The
  # pip ecosystem re-runs pip-compile under the lowest pre-installed Python that
  # satisfies requires-python (">=3.11", so 3.11) and has no --universal, so
  # its lock would be resolved for an interpreter the image does not run.
  #
  # The limit: uv recompiles the lock for 3.15, but it still *chooses* the
  # target version of each direct dependency (the ones declared in
  # pyproject.toml) under that lowest Python, 3.11, and so does a security
  # update. A release that needs Python 3.12+ is never proposed; if it carries
  # a security fix, CI's pip-audit of the lock fails and the bump is by hand.
  # Only transitive dependencies are chosen for 3.15. uv's support for
  # `uv pip compile` files is in dependabot-core's code and specs, not its docs.
  - package-ecosystem: uv
    directory: /backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      # vite and its plugin declare a peer relationship, so a lone bump of
      # either produces an uninstallable tree. Same for the react/react-dom and
      # type packages.
      build-toolchain:
        patterns: ["vite", "@vitejs/*", "typescript"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      everything-else:
        patterns: ["*"]
        exclude-patterns: ["vite", "@vitejs/*", "typescript", "react", "react-dom", "@types/react*"]
        update-types: [minor, patch]

  # Keeps the digest-pinned base images current. Pinning without this trades a
  # supply-chain risk for a staleness one. It reads FROM lines only, so the
  # Dockerfile's `# syntax=` frontend pin is mirrored in a never-built
  # `syntax-pin` stage that this entry bumps (see the Dockerfile's comment).
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]
