[project]
name = "ktn-enclosure-manager"
version = "1.6.2"
description = "Local, zero-cost enclosure manager for SES disk shelves on TrueNAS SCALE (validated on EMC KTN-STL3)"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "websockets>=13.0",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    # Exact pin, unlike the floors above: this install IS the CI type-check
    # gate (verify.yml runs mypy from it), so a new mypy release cannot turn
    # the gate red on an unchanged commit, and local runs match CI. Bump it
    # deliberately; Dependabot's pip entry for /backend sees this line.
    "mypy==2.4.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ktnmgr*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
# CI runs:  mypy --config-file backend/pyproject.toml backend/ktnmgr helper
# That command does not need mypy_path: naming backend/ktnmgr puts backend/ on
# the search path. It is for checking helper/ on its own (e.g. `... helper`):
# the helper imports `ktnmgr`, which it puts on sys.path itself at runtime, and
# mypy cannot follow the editable install's import hook. Resolved relative to
# this file, so it works from any cwd.
mypy_path = "$MYPY_CONFIG_FILE_DIR"
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["../tests"]
asyncio_mode = "auto"
