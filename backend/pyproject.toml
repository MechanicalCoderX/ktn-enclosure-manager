[project]
name = "ktn-enclosure-manager"
version = "1.6.4"
description = "Local, zero-cost enclosure manager for SES disk shelves on TrueNAS SCALE (validated on EMC KTN-STL3)"
requires-python = ">=3.15"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    # Not uvicorn[standard]: pip check ignores extras, and [standard] also
    # brought PyYAML (no cp315 wheel, so the image built it from source)
    # and watchfiles (--reload only). These two are the parts the server
    # uses; uvicorn picks them up on its own (--loop/--http auto).
    # websockets, below, is the TrueNAS client's transport.
    "uvicorn>=0.32",
    "uvloop>=0.15.1; sys_platform != 'win32' and sys_platform != 'cygwin' and platform_python_implementation != 'PyPy'",
    "httptools>=0.8.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "websockets>=13.0",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    # Exact pin, unlike the floors above: this install IS the CI type-check
    # gate (verify.yml runs mypy from it), so a new mypy release cannot turn
    # the gate red on an unchanged commit, and local runs match CI. Bump it
    # deliberately; Dependabot's /backend entry sees this line.
    "mypy==2.4.1",
    # Imported by tests; declared rather than left to arrive transitively.
    "packaging>=24",
    "pyyaml>=6.0",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ktnmgr*"]

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.15"
# CI runs:  mypy --config-file backend/pyproject.toml backend/ktnmgr helper
# That command does not need mypy_path: naming backend/ktnmgr puts backend/ on
# the search path. It is for checking helper/ on its own (e.g. `... helper`):
# the helper imports `ktnmgr`, which it puts on sys.path itself at runtime, and
# mypy cannot follow the editable install's import hook. Resolved relative to
# this file, so it works from any cwd.
mypy_path = "$MYPY_CONFIG_FILE_DIR"
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["../tests"]
asyncio_mode = "auto"
