# KTN Enclosure Manager - TrueNAS SCALE Custom App / docker compose.
#
# HOST ACCESS THIS CONTAINER REQUIRES, and why (spec §32):
#
#   /dev/sg*   The SES enclosure device. Everything the app does to the
#              hardware goes through it: read-only telemetry pages, and the one
#              write it can perform (the IDENT LED).
#
#              ':rw' is needed ONLY for that one write. Measured on the live
#              shelf (2026-08-20): the device cgroup gates the open() mode,
#              not SG_IO itself - every telemetry page works through a
#              read-only open (reads pass --readonly since v1.5.2), while
#              SEND DIAGNOSTIC (the LED) needs a write-opened fd. An earlier
#              note here claimed SG_IO counts as a write even for read-only
#              pages; that measurement had only shown sg_ses's default O_RDWR
#              open being refused. This addresses the enclosure processor,
#              not disk data.
#
#              Monitoring-only deployments may grant ':r' instead: all
#              telemetry keeps working and the Identify button returns a
#              clear error instead of lighting the LED.
#
# That is the entire list. In particular this app does NOT need:
#
#   - a /sys bind mount. Docker's own read-only /sys already exposes
#     /sys/class/enclosure, which is all the app reads.
#   - a writable /sys, CAP_DAC_OVERRIDE, or apparmor=unconfined. The IDENT LED
#     is driven by a SCSI command rather than a sysfs write, and SG_IO is not
#     restricted by Docker's default AppArmor profile.
#   - --privileged, ever.

services:
  ktn-enclosure-manager:
    image: ghcr.io/mechanicalcoderx/ktn-enclosure-manager:1.5.4
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ktn-enclosure-manager
    restart: unless-stopped

    ports:
      - "${KTN_BIND_ADDRESS:-0.0.0.0}:${KTN_PUBLISH_PORT:-8420}:8420"

    volumes:
      # Application state: accounts, session key, IDENT timers, audit log.
      # Must be writable by uid 1000; the app refuses to start otherwise.
      - ${KTN_DATA_PATH:-./data}:/data

    devices:
      - "${KTN_SG_DEVICE:-/dev/sg16}:${KTN_SG_DEVICE:-/dev/sg16}:rw"

    cap_drop:
      - ALL
    cap_add:
      # setpriv drops the web process to uid/gid 1000. Without these the whole
      # application would have to stay root, which is strictly worse. No
      # capability is needed for the LED itself.
      - SETUID
      - SETGID

    security_opt:
      - no-new-privileges:true
      # Note: the default AppArmor profile is deliberately left in place.

    environment:
      KTN_DATA_DIR: /data
      KTN_PORT: "8420"
      KTN_IDENT_HELPER_SOCKET: /run/ktn/ident.sock
      # 'ses' issues a SCSI command; 'sysfs' writes the locate attribute and
      # would then require a writable /sys and apparmor=unconfined.
      KTN_IDENT_METHOD: ${KTN_IDENT_METHOD:-auto}
      KTN_TRUENAS_URL: ${KTN_TRUENAS_URL:-}
      KTN_TRUENAS_API_KEY: ${KTN_TRUENAS_API_KEY:-}
      KTN_TRUENAS_VERIFY_TLS: ${KTN_TRUENAS_VERIFY_TLS:-true}
      KTN_TRUENAS_CA_BUNDLE: ${KTN_TRUENAS_CA_BUNDLE:-}
      # Legacy REST /api/v2.0 fallback. Off by default: role-scoped keys are
      # refused by REST (403) while working over JSON-RPC, and REST is removed
      # in TrueNAS 26.04. Enable only with a full-access key.
      KTN_TRUENAS_REST_FALLBACK: ${KTN_TRUENAS_REST_FALLBACK:-false}
      KTN_ENCLOSURE_ALLOWLIST: ${KTN_ENCLOSURE_ALLOWLIST:-}
      # Authentication. Default on; see .env.example for what turning it off
      # exposes, and why the LED write is gated separately.
      KTN_AUTH_REQUIRED: ${KTN_AUTH_REQUIRED:-true}
      KTN_ALLOW_ANONYMOUS_IDENT: ${KTN_ALLOW_ANONYMOUS_IDENT:-false}
      KTN_ALERT_WEBHOOK_URL: ${KTN_ALERT_WEBHOOK_URL:-}
      KTN_ALERT_STYLE: ${KTN_ALERT_STYLE:-ntfy}
      KTN_ALERT_ON_RECOVERY: ${KTN_ALERT_ON_RECOVERY:-true}
      KTN_POLL_SLOTS_SECONDS: ${KTN_POLL_SLOTS_SECONDS:-5}
      KTN_POLL_TRUENAS_SECONDS: ${KTN_POLL_TRUENAS_SECONDS:-20}
      KTN_POLL_SES_SECONDS: ${KTN_POLL_SES_SECONDS:-30}
      KTN_POLL_SMART_SECONDS: ${KTN_POLL_SMART_SECONDS:-120}

    tmpfs:
      # The helper binds its socket under gid 1000 itself (setegid, via the
      # retained CAP_SETGID), so no CAP_CHOWN is needed. The 2770 mode here is
      # defence in depth, not the mechanism - nothing depends on the
      # directory's setgid bit (an entrypoint chmod would silently strip it
      # anyway: no CAP_FSETID; see docker-entrypoint.sh).
      - /run/ktn:mode=2770,uid=0,gid=1000
